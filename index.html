    // =========================================================================
    // HELPER UI (TOAST, SANITASI HTML, META VISUAL KARTU)
    // =========================================================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/20',
        error: 'bg-red-600 text-white shadow-lg shadow-red-600/20',
        warning: 'bg-amber-500 text-white shadow-lg shadow-amber-500/20',
        info: 'bg-[#1E1B4B] text-white shadow-lg shadow-indigo-950/20'
      };

      const icons = {
        success: 'check-circle-2',
        error: 'alert-circle',
        warning: 'alert-triangle',
        info: 'info'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium transition-all duration-300 transform translate-y-0 opacity-100 ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0"></i>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getCardVisualMeta(mapel, jenis) {
      const m = (mapel || '').toLowerCase();
      if (m.includes('matematika')) {
        return { bg: 'from-violet-600 to-indigo-700', icon: 'sigma', tagBg: 'bg-rose-500 text-white' };
      }
      if (m.includes('ipas') || m.includes('ipa')) {
        return { bg: 'from-emerald-500 to-teal-700', icon: 'flask-conical', tagBg: 'bg-amber-400 text-indigo-950' };
      }
      if (m.includes('bahasa')) {
        return { bg: 'from-sky-500 to-blue-700', icon: 'book-type', tagBg: 'bg-rose-500 text-white' };
      }
      if (m.includes('informatika') || m.includes('smk')) {
        return { bg: 'from-fuchsia-600 to-purple-800', icon: 'terminal', tagBg: 'bg-emerald-400 text-indigo-950' };
      }
      if (m.includes('ips') || m.includes('pancasila')) {
        return { bg: 'from-amber-500 to-orange-600', icon: 'globe-2', tagBg: 'bg-white text-orange-700' };
      }
      return {
        bg: jenis === 'LKPD' ? 'from-indigo-500 to-purple-700' : 'from-[#6C3CE9] to-[#4318B8]',
        icon: jenis === 'LKPD' ? 'clipboard-check' : 'book-open-check',
        tagBg: jenis === 'LKPD' ? 'bg-amber-400 text-indigo-950' : 'bg-rose-500 text-white'

    // =========================================================================
    // DATA LAYER (STRICT DUAL-MODE: IN-MEMORY vs FIREBASE FIRESTORE)
    // =========================================================================
    async function loadAllData() {
      state.isLoadingData = true;
      renderApp();

      try {
        if (IS_PREVIEW) {
          // Mode Preview: 100% in-memory, dilarang menyentuh Firestore
          state.perangkatList = [...memoryPerangkatAjar];
          state.usersList = [...memoryUsers];
        } else {
          // Mode Produksi: 100% langsung dari Firebase Firestore (Zero Dummy Data)
          if (!db) throw new Error("Koneksi Firestore belum terkonfigurasi.");

          const perangkatSnap = await getDocs(collection(db, "perangkat_ajar"));
          const loadedPerangkat = [];
          perangkatSnap.forEach((docSnap) => {
            loadedPerangkat.push({ id: docSnap.id, ...docSnap.data() });
          });
          loadedPerangkat.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
          state.perangkatList = loadedPerangkat;

          if (state.currentUser?.role === 'admin') {
            const usersSnap = await getDocs(collection(db, "users"));
            const loadedUsers = [];
            usersSnap.forEach((docSnap) => {
              loadedUsers.push({ id: docSnap.id, ...docSnap.data() });
            });
            state.usersList = loadedUsers;
          }
        }
      } catch (err) {
        console.error("Error memuat data:", err);
        showToast("Gagal memuat data dari server: " + err.message, "error");
      } finally {
        state.isLoadingData = false;
        renderApp();
      }
    }

    async function toggleFavorit(perangkatId) {
      if (!state.currentUser) return;
      const currentFavs = Array.isArray(state.currentUser.favoritIds) ? [...state.currentUser.favoritIds] : [];
      const exists = currentFavs.includes(perangkatId);
      const updatedFavs = exists
        ? currentFavs.filter((id) => id !== perangkatId)
        : [...currentFavs, perangkatId];

      state.currentUser.favoritIds = updatedFavs;
      renderApp();

      try {
        if (IS_PREVIEW) {
          if (state.currentUser.role === 'guru') {
            const idx = memoryUsers.findIndex((u) => u.id === state.currentUser.id);
            if (idx !== -1) memoryUsers[idx].favoritIds = updatedFavs;
          }
          showToast(exists ? "Dihapus dari Koleksi Favorit." : "Disimpan ke Koleksi Favorit!", "success");
        } else {
          if (state.currentUser.role === 'guru' && state.currentUser.id) {
            const userRef = doc(db, "users", state.currentUser.id);
            await updateDoc(userRef, {
              favoritIds: exists ? arrayRemove(perangkatId) : arrayUnion(perangkatId)
            });
          }
          showToast(exists ? "Dihapus dari Koleksi Favorit." : "Disimpan ke Koleksi Favorit!", "success");
        }
      } catch (err) {
        showToast("Gagal menyinkronkan favorit: " + err.message, "error");
      }
    }

            const idx = memoryPerangkatAjar.findIndex((item) => item.id === editId);

            showToast("Perangkat ajar diperbarui (Mode Preview).", "success");

    async function saveUserAccount(payload, editId = null) {
      state.isSubmitting = true;
      renderModalLoading(true);

      try {
        if (IS_PREVIEW) {
          if (editId) {
            const idx = memoryUsers.findIndex((u) => u.id === editId);
            if (idx !== -1) memoryUsers[idx] = { ...memoryUsers[idx], ...payload };
            showToast("Data akun guru diperbarui (Mode Preview).", "success");
          } else {
            const exists = memoryUsers.some((u) => u.username.toLowerCase() === payload.username.toLowerCase());
            if (exists) throw new Error("Username/NIP sudah terdaftar.");
            memoryUsers.unshift({ id: "usr_demo_" + Date.now(), ...payload, favoritIds: [] });
            showToast("Akun guru baru ditambahkan (Mode Preview).", "success");
          }
          closeModal();
          await loadAllData();
        } else {
          if (editId) {
            await updateDoc(doc(db, "users", editId), { ...payload, updatedAt: serverTimestamp() });
            showToast("Akun guru berhasil diperbarui di Firestore.", "success");
          } else {
            const qCheck = query(collection(db, "users"), where("username", "==", payload.username));
            const snapCheck = await getDocs(qCheck);
            if (!snapCheck.empty) throw new Error("Username/NIP tersebut sudah digunakan oleh guru lain.");
            await addDoc(collection(db, "users"), { ...payload, favoritIds: [], createdAt: serverTimestamp() });
            showToast("Akun guru baru berhasil didaftarkan ke Firestore.", "success");
          }
          closeModal();
          await loadAllData();
        }
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        state.isSubmitting = false;
        renderModalLoading(false);
      }
    }

    // =========================================================================
    // HYBRID AUTHENTICATION (GURU VIA FIRESTORE, ADMIN VIA FIREBASE AUTH)
    // =========================================================================
    async function handleGuruLogin(username, password) {
      if (!username || !password) {
        showToast("Mohon isi Username/NIP dan Kata Sandi.", "warning");
        return;
      }

      state.authLoading = true;
      renderApp();

      try {
        if (IS_PREVIEW) {
          const found = memoryUsers.find(
            (u) => u.username.trim().toLowerCase() === username.trim().toLowerCase() && u.password === password
          );
          if (!found) throw new Error("Username/NIP atau Kata Sandi Guru tidak sesuai.");
          if (found.status !== "aktif") throw new Error("Akun Anda sedang dinonaktifkan oleh Admin Kurikulum.");

          state.currentUser = {
            role: 'guru',
            id: found.id,
            username: found.username,
            namaLengkap: found.namaLengkap,
            sekolah: found.sekolah,
            mapelAmpu: found.mapelAmpu,
            favoritIds: Array.isArray(found.favoritIds) ? [...found.favoritIds] : []
          };
          state.activeMenu = 'dashboard';
          showToast(`Selamat datang, ${found.namaLengkap}!`, "success");
          await loadAllData();
        } else {
          if (!db) throw new Error("Konfigurasi Firebase Firestore belum siap.");
          const qUser = query(collection(db, "users"), where("username", "==", username.trim()));
          const querySnapshot = await getDocs(qUser);
          if (querySnapshot.empty) throw new Error("Username/NIP tidak ditemukan di database sekolah.");

          let matchedUser = null;
          querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if (data.password === password) matchedUser = { id: docSnap.id, ...data };
          });

          if (!matchedUser) throw new Error("Kata sandi yang Anda masukkan salah.");
          if (matchedUser.status !== "aktif") throw new Error("Akun Anda berstatus nonaktif. Hubungi Admin Kurikulum.");

          state.currentUser = {
            role: 'guru',
            id: matchedUser.id,
            username: matchedUser.username,
            namaLengkap: matchedUser.namaLengkap,
            sekolah: matchedUser.sekolah || 'Satuan Pendidikan',
            mapelAmpu: matchedUser.mapelAmpu || 'Semua Mapel',
            favoritIds: Array.isArray(matchedUser.favoritIds) ? [...matchedUser.favoritIds] : []
          };
          state.activeMenu = 'dashboard';
          showToast(`Selamat datang, ${matchedUser.namaLengkap}!`, "success");
          await loadAllData();
        }
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        state.authLoading = false;
        renderApp();
      }
    }

    async function handleAdminLogin(email, password) {
      if (!email || !password) {
        showToast("Mohon masukkan Email Admin dan Kata Sandi.", "warning");
        return;
      }

      state.authLoading = true;
      renderApp();

      try {
        if (IS_PREVIEW) {
          if (email.trim().toLowerCase() === "admin@merdekaajar.id" && password === "admin123") {
            state.currentUser = {
              role: 'admin',
              uid: 'admin_demo_uid',
              email: 'admin@merdekaajar.id',
              namaLengkap: 'Admin Kurikulum Merdeka',
              sekolah: 'Tim Pengembang Kurikulum',
              mapelAmpu: 'Administrator Sistem',
              favoritIds: []
            };
            state.activeMenu = 'dashboard';
            showToast("Login Admin berhasil (Mode Preview).", "success");
            await loadAllData();
          } else {
            throw new Error("Kredensial Admin demo tidak valid.");
          }
        } else {
          if (!auth) throw new Error("Firebase Authentication belum terkonfigurasi.");
          const userCredential = await signInWithEmailAndPassword(auth, email.trim(), password);
          const fbUser = userCredential.user;
          state.currentUser = {
            role: 'admin',
            uid: fbUser.uid,
            email: fbUser.email,
            namaLengkap: fbUser.displayName || 'Administrator Kurikulum',
            sekolah: 'Manajemen Pusat Kurikulum',
            mapelAmpu: 'Admin Sistem',
            favoritIds: []
          };
          state.activeMenu = 'dashboard';
          showToast("Berhasil masuk sebagai Administrator.", "success");
          await loadAllData();
        }
      } catch (err) {
        let msg = err.message;
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
          msg = "Email atau Kata Sandi Admin tidak terdaftar di Firebase Auth.";
        }
        showToast(msg, "error");
      } finally {
        state.authLoading = false;
        renderApp();
      }
    }

    async function handleLogout() {
      try {
        if (!IS_PREVIEW && auth && state.currentUser?.role === 'admin') {

    // =========================================================================
    // FILTERING ENGINE
    // =========================================================================
    function getFilteredPerangkat(forcedJenis = null) {
      return state.perangkatList.filter((item) => {
        if (forcedJenis && item.jenis !== forcedJenis) return false;
        if (state.activeMenu === 'favorit') {
          const favIds = state.currentUser?.favoritIds || [];
          if (!favIds.includes(item.id)) return false;
        }
        if (state.selectedJenjang !== 'Semua' && item.jenjang !== state.selectedJenjang) return false;
        if (state.selectedFase !== 'Semua' && item.fase !== state.selectedFase) return false;
        if (state.selectedMapel !== 'Semua' && item.mapel !== state.selectedMapel) return false;
        if (state.selectedSemester !== 'Semua' && item.semester !== state.selectedSemester) return false;

        if (state.searchQuery.trim() !== '') {
          const q = state.searchQuery.toLowerCase();
          const haystack = `${item.judul || ''} ${item.mapel || ''} ${item.penulis || ''} ${item.tujuanPembelajaran || ''} ${item.kelas || ''} ${item.fase || ''}`.toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      });
    }

              <div class="absolute -right-4 -bottom-4 opacity-20 pointer-events-none transform group-hover:scale-110 transition-transform">
                <i data-lucide="${visual.icon}" class="w-24 h-24"></i>
              </div>

              <div class="flex items-center justify-between gap-2 relative z-10">
                <span class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase tracking-wider shadow-sm ${visual.tagBg}">
                  ${escapeHtml(item.jenis)}
                </span>
                <button type="button" onclick="event.stopPropagation(); window.__app.toggleFavorit('${item.id}')"

                <span class="text-[11px] font-bold text-white/95 block truncate">${escapeHtml(item.mapel)}</span>
                <span class="text-[10px] text-white/80">${escapeHtml(item.jenjang)} • ${escapeHtml(item.fase)} (${escapeHtml(item.kelas)})</span>
              </div>
            </div>

            <!-- Card Content -->
            <div class="pt-3 px-0.5 space-y-1.5">
              <div class="flex items-center gap-1.5 text-[11px] font-semibold text-amber-500">
                <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400"></i>
                <span class="text-gray-500">Sem. ${escapeHtml(item.semester)} • ${escapeHtml(item.alokasiWaktu || '-')}</span>
              </div>

              <h4 onclick="window.__app.openDetailModal('${item.id}')"
                class="text-sm font-extrabold text-[#1E1B4B] group-hover:text-[#6C3CE9] transition line-clamp-2 cursor-pointer leading-snug">
                ${escapeHtml(item.judul)}
              </h4>

              <p class="text-xs text-gray-500 line-clamp-2 leading-relaxed">
                ${escapeHtml(item.tujuanPembelajaran)}
              </p>
            </div>
          </div>

          <!-- Card Footer -->
          <div class="pt-3 mt-3 border-t border-gray-100 flex items-center justify-between gap-2 px-0.5">
            <div class="min-w-0">
              <span class="text-[10px] text-gray-400 block">Penyusun</span>
              <span class="text-xs font-extrabold text-[#6C3CE9] truncate block">${escapeHtml(item.penulis || 'Tim Kurikulum')}</span>
            </div>

            <button type="button" onclick="window.__app.openDetailModal('${item.id}')"
              title="Buka & Cetak ${escapeHtml(item.jenis)}"
              class="w-9 h-9 rounded-xl bg-[#6C3CE9] hover:bg-[#5A2AD6] text-white flex items-center justify-center shadow-md transition shrink-0">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>
        </article>
      `;
    }

    // =========================================================================
    // MAIN RENDER ORCHESTRATOR
    // =========================================================================
    function renderApp() {
      const mount = document.getElementById('app-content');
      if (!mount) return;

      if (!state.currentUser) {
        mount.innerHTML = renderLoginView();
        if (window.lucide) lucide.createIcons();

        const guruForm = document.getElementById('login-guru-form');
        if (guruForm) {
          guruForm.addEventListener('submit', (e) => {
            e.preventDefault();
            handleGuruLogin(
              document.getElementById('guru-username').value,
              document.getElementById('guru-password').value
            );
          });
        }

        const adminForm = document.getElementById('login-admin-form');
        if (adminForm) {
          adminForm.addEventListener('submit', (e) => {
            e.preventDefault();
            handleAdminLogin(
              document.getElementById('admin-email').value,
              document.getElementById('admin-password').value
            );
          });
        }
      } else {
        mount.innerHTML = renderDashboardView();
        if (window.lucide) lucide.createIcons();

        const searchInput = document.getElementById('global-search-input');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            renderApp();
            const newSearchInput = document.getElementById('global-search-input');
            if (newSearchInput) {
              newSearchInput.focus();
              const len = newSearchInput.value.length;
              newSearchInput.setSelectionRange(len, len);
            }
          });
        }
      }
    }

    // =========================================================================
    // GLOBAL UI CONTROLLER
    // =========================================================================
    window.__app = {
      switchAuthTab(tab) {
        state.authTab = tab;
        renderApp();
      },
      setMenu(menuId) {
        state.activeMenu = menuId;
        renderApp();
      },
      setJenjangFilter(jenjang) {
        state.selectedJenjang = jenjang;
        renderApp();
      },
      setMapelFilter(mapel) {
        state.selectedMapel = mapel;
        renderApp();
      },
      setFaseFilter(fase) {
        state.selectedFase = fase;
        renderApp();
      },
      setSemesterFilter(semester) {
        state.selectedSemester = semester;
        renderApp();
      },
      clearSearch() {
        state.searchQuery = '';
        renderApp();
      },
      resetFilters() {
        state.selectedJenjang = 'Semua';
        state.selectedFase = 'Semua';
        state.selectedMapel = 'Semua';
        state.selectedSemester = 'Semua';
        state.searchQuery = '';
        renderApp();
      },
      toggleFavorit,
      openDetailModal,
      openPerangkatFormModal,
      openUserFormModal,
      openConfirmDeleteModal,
      closeModal,
      handleLogout
    };

    // =========================================================================
    // BOOTSTRAP APPLICATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      if (!IS_PREVIEW && auth) {
        onAuthStateChanged(auth, async (fbUser) => {
          if (fbUser && !state.currentUser) {
            state.currentUser = {
              role: 'admin',
              uid: fbUser.uid,
              email: fbUser.email,
              namaLengkap: fbUser.displayName || 'Administrator Kurikulum',
              sekolah: 'Manajemen Pusat Kurikulum',
              mapelAmpu: 'Admin Sistem',
              favoritIds: []
            };
            await loadAllData();
          } else {
            renderApp();
          }
        });
      } else {
        renderApp();
      }
    });
  </script>
</body>
</html>
